<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Water, Our Choices — English B2 Presentation</title>
  <meta name="description" content="Offline interactive 16:9 presentation on the global and Colombian water crisis through Augusto Ángel Maya and Edgar Morin.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230E5A8A'/%3E%3Cpath d='M16 7 C12 13 10 17 10 20 A6 6 0 0 0 22 20 C22 17 20 13 16 7 Z' fill='%2338BDF8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="app-shell">
    <!-- Escenario 16:9 escalado proporcionalmente (letterbox) -->
    <div id="stageViewport" class="stage-viewport" role="region" aria-label="Presentation stage">
      <div id="stageScaler" class="stage-scaler"></div>
    </div>

    <!-- Modo Orador (tecla N o segunda ventana sincronizada ?speaker=1) -->
    <aside id="speakerPanel" class="speaker-panel" aria-label="Speaker notes and timer">
      <div class="speaker-header">
        <div>
          <strong style="font-size:15px;letter-spacing:0.04em;">SPEAKER MODE</strong>
          <div style="font-size:11px;color:#94A3B8;">Synced notes (ES) · B2 Script (EN) · Timer</div>
        </div>
        <div style="display:flex;gap:6px;">
          <button id="btnPopSpeaker" type="button" class="hud-btn" style="background:rgba(255,255,255,0.08);" title="Open synced speaker notes in a second window">2nd Window ↗</button>
          <button id="btnCloseSpeaker" type="button" class="hud-btn" aria-label="Close speaker panel">✕</button>
        </div>
      </div>

      <div id="timerBar" class="timer-bar">
        <div>
          <div class="timer-lbl">Current Slide</div>
          <div id="timerSlide" class="timer-val">0:00 / 0:45</div>
        </div>
        <div>
          <div class="timer-lbl">Total (15:00)</div>
          <div id="timerTotal" class="timer-val">0:00 / 15:00</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;">
          <button id="timerToggleBtn" type="button" class="hud-btn" style="background:var(--plants);color:#FFF;height:28px;">Start</button>
          <button id="timerResetBtn" type="button" class="hud-btn" style="background:rgba(255,255,255,0.10);height:26px;font-size:12px;">Reset</button>
        </div>
      </div>

      <div id="speakerContent" class="speaker-scroll"></div>
    </aside>
  </div>

  <!-- Controles flotantes discretos -->
  <nav class="hud-controls" aria-label="Presentation controls">
    <button id="btnPrev" type="button" class="hud-btn" title="Previous step or slide (←)">←</button>
    <button id="btnNext" type="button" class="hud-btn" title="Next step or slide (→ / Space)">→</button>
    <button id="btnGrid" type="button" class="hud-btn" title="Slide grid / index (G)">G · Index</button>
    <button id="btnSpeaker" type="button" class="hud-btn" title="Toggle speaker notes &amp; timer (N)">N · Notes</button>
    <button id="btnFull" type="button" class="hud-btn" title="Toggle fullscreen (F)">F · Full</button>
  </nav>

  <!-- Superposición de cuadrícula / índice (tecla G) -->
  <div id="gridOverlay" class="grid-overlay" role="dialog" aria-modal="true" aria-label="Slide index">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:14px;text-transform:uppercase;letter-spacing:0.14em;color:var(--water-bright);font-weight:800;">Slide Overview · 15:00 Total</div>
        <h2 style="margin:4px 0 0;font-size:32px;">Our Water, Our Choices (Opening + 12 Slides + Verified Sources)</h2>
      </div>
      <button id="btnCloseGrid" type="button" class="hud-btn" style="background:rgba(255,255,255,0.12);height:42px;padding:0 18px;">Esc · Close</button>
    </div>
    <div id="gridCards" class="grid-cards"></div>
  </div>

  <!-- Contenedor oculto generado automáticamente al imprimir (@media print) -->
  <div id="printDeck" class="print-deck" aria-hidden="true"></div>

  <script src="js/contenido.js"></script>
  <script src="js/mundo-intro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
